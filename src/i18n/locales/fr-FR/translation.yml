featureShowcase:
  section:
    eyebrow: VITRINE DES FONCTIONNALITÉS HAGICODE
    title: Les trois fonctionnalités principales de Hagicode
  smart:
    badge: INTELLIGENT
    title: Intelligent
    subtitle: Workflow OpenSpec qui accélère l'exécution des idées
    description: >-
      Des idées et propositions à la révision, au codage, aux tests et à l'archivage, Hagicode transforme le codage AI
      de sessions de discussion ponctuelles en un flux de travail suivi que les équipes peuvent fournir, auditer et
      réutiliser.

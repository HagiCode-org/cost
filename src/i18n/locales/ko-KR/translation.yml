    states:
      newly-earned: 새로 획득
      earned: 획득
      locked: 잠김
    origins:
      input: 입력측 트리거
      output: 결과측 트리거
    explainers:
      input: 입력 조건으로 획득합니다. 현재 폼 값만으로도 달성 가능합니다.
      output: 결과 조건으로 획득합니다. 일반 계산 결과가 지정된 임계값을 넘어야 합니다.
    catalog:
      craftsmanSpirit:
        name: 장인정신
        description: 일일 Token = 0 이고 연봉, 도시, 모델, 효율 배수가 모두 입력된 상태입니다. Token 을 쓰기 전에 먼저 워크플로를 다듬는 타입입니다.
      promptAlchemist:
        name: Prompt 연금술사
        description: 효율 배수 >= 6 이고 0 < 일일 Token <= 20 입니다. 과하지 않은 사용량으로 큰 효율 상승을 끌어내고 있습니다.
      allInOperator:
        name: 올인 오퍼레이터
        description: 일일 Token >= 150 이고 효율 배수 >= 3 입니다. 고강도·고투자형 Agent 워크플로의 전형입니다.
      minimalistRunner:
        name: 미니멀리스트 러너
        description: 0 < 일일 Token <= 5 이고 효율 배수 >= 2 입니다. 아주 낮은 예산에서도 유효한 워크플로를 유지합니다.
      costTamer:
        name: 비용 테이머
        description: AI 투자 대비 효과 >= 2.5 이고 AI 비용 비중은 <= 15% 입니다. 비용과 효율의 균형이 매우 깔끔합니다.
      dangerOracle:
        name: 위험 오라클
        description: 등가 인력이 >= 2.5 이거나 위험 척도가 이미 고위험 구간에 들어섰습니다. '확장된 동료'가 주는 압박을 현실적으로 체감하는 상태입니다.
      budgetCoordinator:
        name: 예산 코디네이터
        description: 현재 예산으로 동등한 워크플로를 8개 이상 돌릴 수 있습니다. 이 방식은 돌아가기만 하는 게 아니라 확장도 쉽습니다.
    overlay:
      eyebrow: 타이틀 획득
      title: 새 타이틀 잠금 해제
      description: 더 이상 항상 켜져 있는 제목 패널이 없습니다. 타이틀을 처음 획득하면 전체 화면에 한 번 표시되고 페이지가 정상으로 돌아갑니다.
      footer: 공개는 첫 번째 획득 시에만 발생합니다. 다시 같은 조건에 도달하면 재생되지 않습니다.
      action: 페이지로 돌아가기
    toast:
      title: 새로운 타이틀 획득
      description: '잠금 해제됨: {{titles}}'

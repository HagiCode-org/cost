name: Cost Release Draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (1.2.3 or v1.2.3)
        required: true
        type: string
      target_commitish:
        description: Branch, tag, or commit SHA to package
        required: false
        default: main
        type: string
      release_title:
        description: Optional release title override
        required: false
        type: string
      release_notes:
        description: Optional draft release notes override
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: cost-release-draft-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repos/cost
    env:
      COST_SITE_BASE_PATH: ${{ vars.COST_SITE_BASE_PATH || '/' }}
      COST_SITE_URL: ${{ vars.COST_SITE_URL || 'https://cost.hagicode.com/' }}
      RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/cost-release-assets
      RELEASE_STATE_FILE: ${{ runner.temp }}/cost-release-version-state.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_commitish }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: repos/cost/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Align release version sources
        id: release_version
        run: |
          node ./scripts/release/align-release-version.mjs apply \
            --version "${{ inputs.version }}" \
            --packageJson ./package.json \
            --stateFile "$RELEASE_STATE_FILE" \
            --envOutput "$GITHUB_ENV" \
            --githubOutput "$GITHUB_OUTPUT"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build production site
        run: npm run build

      - name: Package draft release assets
        id: package_release
        run: |
          mkdir -p "$RELEASE_ARTIFACT_DIR"
          node ./scripts/release/package-release.mjs \
            --version "${{ steps.release_version.outputs.version }}" \
            --tag "${{ steps.release_version.outputs.tag }}" \
            --distDir ./dist \
            --outputDir "$RELEASE_ARTIFACT_DIR" \
            --commitSha "$(git rev-parse HEAD)" \
            --basePath "$COST_SITE_BASE_PATH" \
            --siteUrl "$COST_SITE_URL" \
            > "$RUNNER_TEMP/cost-release-package.json"
          cat "$RUNNER_TEMP/cost-release-package.json"
          archive_path=$(node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); console.log(data.archivePath)" "$RUNNER_TEMP/cost-release-package.json")
          manifest_path=$(node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); console.log(data.manifestPath)" "$RUNNER_TEMP/cost-release-package.json")
          archive_name=$(basename "$archive_path")
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "manifest_path=$manifest_path" >> "$GITHUB_OUTPUT"

      - name: Restore package version
        if: always()
        run: |
          node ./scripts/release/align-release-version.mjs restore \
            --stateFile "$RELEASE_STATE_FILE" \
            --ignoreMissingState

      - name: Create or update GitHub Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          ARCHIVE_PATH: ${{ steps.package_release.outputs.archive_path }}
          MANIFEST_PATH: ${{ steps.package_release.outputs.manifest_path }}
        run: |
          set -euo pipefail
          release_title="${RELEASE_TITLE:-Cost ${RELEASE_TAG}}"
          existing_release_json=""
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,id,name >/tmp/cost-release-view.json 2>/dev/null; then
            existing_release_json=$(cat /tmp/cost-release-view.json)
          fi

          if [ -n "$existing_release_json" ]; then
            is_draft=$(node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('/tmp/cost-release-view.json','utf8')); console.log(data.isDraft ? 'true' : 'false')")
            if [ "$is_draft" != "true" ]; then
              echo "Release $RELEASE_TAG already exists and is published. Refusing to overwrite it." >&2
              exit 1
            fi

            if [ -n "${RELEASE_NOTES:-}" ]; then
              notes_file="$RUNNER_TEMP/cost-release-notes.md"
              printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
              gh release edit "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$release_title" \
                --notes-file "$notes_file" \
                --target "$(git rev-parse HEAD)"
            else
              gh release edit "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$release_title" \
                --target "$(git rev-parse HEAD)"
            fi
          else
            if [ -n "${RELEASE_NOTES:-}" ]; then
              notes_file="$RUNNER_TEMP/cost-release-notes.md"
              printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
              gh release create "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --draft \
                --target "$(git rev-parse HEAD)" \
                --title "$release_title" \
                --notes-file "$notes_file"
            else
              gh release create "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --draft \
                --target "$(git rev-parse HEAD)" \
                --title "$release_title" \
                --generate-notes
            fi
          fi

          gh release upload "$RELEASE_TAG" \
            "$ARCHIVE_PATH" \
            "$MANIFEST_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Summarize draft release output
        env:
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
          ARCHIVE_NAME: ${{ steps.package_release.outputs.archive_name }}
        run: |
          {
            echo "## Cost draft release prepared"
            echo ""
            echo "- Tag: $RELEASE_TAG"
            echo "- Frozen asset: $ARCHIVE_NAME"
            echo "- Manifest: release-manifest.json"
            echo "- Base path: $COST_SITE_BASE_PATH"
            echo "- Site URL: $COST_SITE_URL"
          } >> "$GITHUB_STEP_SUMMARY"

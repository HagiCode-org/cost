shareTemplates:
  verdict: >-
    Bei meiner derzeitigen Konstellation beläuft sich mein Jahresgrundgehalt auf {{annualIncome}} und die jährlichen
    Gesamtbeschäftigungskosten auf {{annualTotalCost}}. Wenn ein Kollege {{modelName}} verwendet, könnte er auf etwa
    {{effectivePeopleEquivalent}} skalieren. {{verdictHeadline}}
  costImpact: >-
    Zählen Sie die Zahlen auf: Die jährlichen Gesamtbeschäftigungskosten meines Arbeitgebers belaufen sich auf
    {{annualTotalCost}}, und die jährlichen Ausgaben in Höhe von AI belaufen sich bei dieser Intensität auf etwa
    {{annualAiCost}}. Wenn ein Kollege ebenfalls {{modelName}} verwendet, skaliert er auf ungefähr
    {{effectivePeopleEquivalent}}. {{exchangeRateText}}
  challenge: >-

        name: オールインオペレーター
        description: 日次 Token >= 150 かつ効率倍率 >= 3。高投入・高強度で Agent を回す典型的なスタイルです。
      minimalistRunner:
        name: ミニマリストランナー
        description: 0 < 日次 Token <= 5 かつ効率倍率 >= 2。ごく小さな予算でも、実用的なワークフローを維持しています。

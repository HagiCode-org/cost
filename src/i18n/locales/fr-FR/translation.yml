  hagicode:
    heading: Et si Hagicode amplifiait votre efficacité ?
    subtitle: >-
      Hagicode peut piloter plusieurs agents en parallèle, transformant la proposition, la mise en œuvre, les correctifs
      et la révision des attentes en série en progrès parallèles. Ajustez le curseur ci-dessous et nous recalculerons
      immédiatement la menace des collègues et la valeur AI selon ce modèle révisé.
    multiplierLabel: Séances parallèles
    sliderLabel: Séances parallèles
    sliderHint: >-
      Faites glisser entre 1,5 et 10 pour définir le nombre de sessions parallèles que Hagicode gère simultanément. Plus
      de sessions parallèles signifient une plus grande amplification de l’efficacité subjective.
    utilizationLabel: Token augmentation de l'utilisation
    utilizationHint: >-
      Glissez entre 1.1 et 2.0. Une utilisation plus élevée signifie que OpenSpec réduit les retouches, les utilisations
      abusives et les hallucinations, de sorte que les dépenses réelles en jetons sont diluées sous le même résultat
      cible.
    utilizationCompact: Token utilisation {{value}}
    currentLabel: Maintenant
    boostedLabel: Après Hagicode
    beforeAfterLabel: Maintenant -> Après Hagicode
    afterBoostLabel: Après le coup de pouce Hagicode
    scaledEfficiency: Productivité après mise à l'échelle de sessions parallèles
    scaledTokenUsage: Utilisation quotidienne des jetons à l'échelle
    scaledAnnualAiCost: Coût annuel AI échelonné
    syncResult: Impact de titre synchronisé
    syncFormula: Menace d'un collègue {{threatBefore}} -> {{threatAfter}}, valeur AI {{valueBefore}} -> {{valueAfter}}
    modelLabel: Modèle de jeton révisé
    modelFormula: >-
      Nouvelle dépense de jetons = base {{base}} x Hagicode {{boost}} ÷ utilisation du jeton {{utilization}} =
      {{final}}. En d’autres termes, cela s’étend d’abord à {{raw}}, puis l’efficacité du flux de travail standardisé
      ramène les dépenses effectives à {{final}}.
    scaledAnnualAiCostFormula: '{{tokenUsage}} × prix unitaire du modèle = {{cost}}'
    detailCollapseLabel: Voir la comparaison détaillée
    detailCollapseAria: Développez pour afficher des données détaillées sur l'efficacité, les jetons et la comparaison des coûts.

        name: 匠人精神
        description: 日均 Token = 0，且年薪、城市、模型、效率倍數都已填入。你選擇先把流程打磨清楚，再決定是否要花 Token。
      promptAlchemist:
        name: 提示詞煉金師
        description: 效率倍數 >= 6，且 0 < 日均 Token <= 20。說明你用不算誇張的消耗，換到了很高的效率放大。
      allInOperator:
        name: 火力全開
        description: 日均 Token >= 150，且效率倍數 >= 3。你是典型的高投入高強度 Agent 使用者。
      minimalistRunner:
        name: 極簡派
        description: 0 < 日均 Token <= 5，且效率倍數 >= 2。你在極低預算下，依然保持了有效工作流程。
      costTamer:
        name: 成本馴獸師
        description: AI 投入產出比 >= 2.5，且 AI 成本佔比 <= 15%。你把成本和效益壓在了一個很漂亮的平衡點。
      dangerOracle:
        name: 危險先知
        description: 等效人力 >= 2.5，或危險刻度進入高危險區。你已經可以看到「同事把自己放大之後」的真正壓迫感。
      budgetCoordinator:
        name: 預算統籌官
        description: 目前預算可以涵蓋 >= 8 份同類工作流程。說明這套打法不只是能跑，還很容易規模化複製。

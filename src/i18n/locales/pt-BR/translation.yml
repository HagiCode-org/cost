    utilizationLabel: Token aumento de utilização
    utilizationHint: >-
      Deslize entre 1.1 e 2.0. Maior utilização significa que OpenSpec reduz o retrabalho, o uso indevido e a
      alucinação, de modo que o gasto real com tokens é diluído no mesmo resultado alvo.

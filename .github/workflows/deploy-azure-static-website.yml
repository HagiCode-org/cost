name: Deploy Cost Site

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to redeploy (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cost-release-deploy-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  COST_GH_PAGES_PAYLOAD_DIR: .deploy/gh-pages
  COST_SITE_BASE_PATH: ${{ vars.COST_SITE_BASE_PATH || '/' }}
  COST_SITE_URL: ${{ vars.COST_SITE_URL || 'https://cost.hagicode.com/' }}

jobs:
  build:
    name: Build validated release snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?([+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Align package version for release build
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: NODE_ENV=production npm run build
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
          VITE_BASE_PATH: ${{ env.COST_SITE_BASE_PATH }}
          VITE_SITE_URL: ${{ env.COST_SITE_URL }}

      - name: Assemble gh-pages publication payload
        run: |
          rm -rf "${COST_GH_PAGES_PAYLOAD_DIR}"
          mkdir -p "${COST_GH_PAGES_PAYLOAD_DIR}/dist"
          cp .github/gh-pages/esa.jsonc "${COST_GH_PAGES_PAYLOAD_DIR}/esa.jsonc"
          cp -R dist/. "${COST_GH_PAGES_PAYLOAD_DIR}/dist/"

      - name: Upload validated gh-pages payload
        uses: actions/upload-artifact@v4
        with:
          name: cost-gh-pages-payload
          path: ${{ env.COST_GH_PAGES_PAYLOAD_DIR }}
          if-no-files-found: error

  deploy:
    name: Publish validated release to gh-pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    environment:
      name: cost-production
      url: https://cost.hagicode.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated gh-pages payload
        uses: actions/download-artifact@v4
        with:
          name: cost-gh-pages-payload
          path: .deploy/gh-pages

      - name: Publish validated gh-pages payload
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./.deploy/gh-pages
          force_orphan: true
          enable_jekyll: false

      - name: Summarize deployment
        shell: bash
        run: |
          {
            echo "## Cost deployment finished"
            echo
            echo "- Release tag: ${{ github.event.release.tag_name || inputs.tag }}"
            echo "- Published branch: gh-pages"
            echo "- Payload shape: ./esa.jsonc + ./dist/"
            echo "- Base path: $COST_SITE_BASE_PATH"
            echo "- Site URL: $COST_SITE_URL"
            echo "- GitHub environment: cost-production"
          } >> "$GITHUB_STEP_SUMMARY"

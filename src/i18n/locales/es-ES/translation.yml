    other: Otro
  titles:
    eyebrow: TÍTULOS ESPECIALES
    title: tablero de título especial
    subtitle: >-
      Las reglas del lado de entrada y del lado de resultados se evalúan juntas para que la página pueda indicarle a qué
      tipo de operador Agent se parece esta configuración.
    zeroTokenHint: >-
      No gastaste tokens, por lo que se omite la estimación normal para esta ejecución, pero aún podemos juzgar qué
      títulos desbloquea tu configuración actual.
    progress: '{{matched}} / {{total}} títulos coincidentes'
    states:
      newly-earned: recién ganado
      earned: Ganado
      locked: bloqueado
    origins:
      input: Gatillo del lado de entrada
      output: Activador del lado del resultado
    explainers:
      input: >-
        Desde una regla del lado de entrada: los valores del formulario actual por sí solos son suficientes para
        desbloquearlo.
      output: 'Desde una regla del lado de los resultados: la estimación normal debe cruzar los umbrales requeridos.'
    catalog:
      craftsmanSpirit:
        name: Espíritu artesano
        description: >-
          Fichas diarias = 0, mientras que el salario, la ciudad, el modelo y el multiplicador son todos válidos. Está
          refinando el flujo de trabajo antes de decidir gastar tokens.
      promptAlchemist:
        name: Prompt Alquimista
        description: >-
          Multiplicador de rendimiento >= 6 y 0 <tokens diarios <= 20. Estás obteniendo un gran apalancamiento de un
          presupuesto de tokens aún disciplinado.
      allInOperator:
        name: Operador integral
        description: >-
          Tokens diarios >= 150 y multiplicador de rendimiento >= 3. Esta es la firma de un flujo de trabajo Agent de
          alta intensidad y alto gasto.
      minimalistRunner:
        name: Corredor minimalista
        description: >-
          0 < tokens diarios <= 5 y multiplicador de rendimiento >= 2. Mantienes el flujo de trabajo útil incluso con un
          presupuesto de tokens casi pequeño.
      costTamer:
        name: Domador de costos
        description: >-
          Rentabilidad >= 2,5 mientras que AI coste compartido se mantiene <= 15 %. Encontró un equilibrio notablemente
          limpio entre gasto y rentabilidad.
      dangerOracle:
        name: Peligro Oráculo
        description: >-
          Personas efectivas equivalentes >= 2,5, o la escala de peligro ya entró en riesgo alto. Estás mirando la
          presión real de un compañero de trabajo multiplicado.
      budgetCoordinator:
        name: Coordinador de Presupuesto
        description: >-
          El presupuesto actual puede sostener >= 8 flujos de trabajo equivalentes. Esta configuración no sólo es
          viable, sino que también es fácil de escalar.
    overlay:
      eyebrow: TÍTULO ADQUIRIDO
      title: Nuevo título desbloqueado
      description: >-
        Ya no hay un panel de título siempre activo. Cuando se obtiene un título por primera vez, se muestra en pantalla
        completa y luego la página vuelve a la normalidad.
      footer: >-
        La revelación sólo ocurre en la primera adquisición. Al alcanzar la misma condición nuevamente no se
        reproducirá.
      action: volver a la pagina
    toast:
      title: Nuevo título obtenido
      description: 'Desbloqueado: {{titles}}'

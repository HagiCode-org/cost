    admin: Administrateur
    other: Autre
  titles:
    eyebrow: TITRES SPÉCIAUX
    title: Panneau de titre spécial
    subtitle: >-
      Les règles côté entrée et côté résultat sont évaluées ensemble afin que la page puisse vous indiquer à quel type
      d'opérateur Agent cette configuration ressemble.
    zeroTokenHint: >-
      Vous n'avez dépensé aucun jeton, l'estimation normale est donc ignorée pour cette exécution, mais nous pouvons
      toujours juger quels titres votre configuration actuelle débloque.
    progress: "{{matched}} / {{total}}\_titres correspondants"
    states:
      newly-earned: Nouvellement gagné
      earned: Gagné
      locked: Fermé
    origins:
      input: Déclencheur côté entrée
      output: Déclencheur côté résultat
    explainers:
      input: "À partir d'une règle côté entrée\_: les valeurs actuelles du formulaire suffisent à elles seules à le déverrouiller."
      output: 'D’une règle côté résultat : l’estimation normale doit franchir les seuils requis.'
    catalog:
      craftsmanSpirit:
        name: Esprit d'artisan
        description: >-
          Jetons quotidiens = 0 tandis que le salaire, la ville, le modèle et le multiplicateur sont tous valides. Vous
          affinez le flux de travail avant de décider de dépenser des jetons.
      promptAlchemist:
        name: Prompt Alchimiste
        description: >-
          Multiplicateur de performances >= 6 et 0 < jetons quotidiens <= 20. Vous tirez un sérieux effet de levier d'un
          budget de jetons toujours discipliné.
      allInOperator:
        name: Opérateur tout-en-un
        description: >-
          Jetons quotidiens >= 150 et multiplicateur de performances >= 3. C'est la signature d'un workflow Agent de
          haute intensité et à dépenses élevées.
      minimalistRunner:
        name: Coureur minimaliste
        description: >-
          0 < jetons quotidiens <= 5 et multiplicateur de performances >= 2. Vous gardez le flux de travail utile même
          avec un budget de jetons presque minuscule.
      costTamer:
        name: Dompteur de coûts
        description: "Rentabilité >= 2,5 tandis que la part des coûts AI reste <= 15\_%. Vous avez trouvé un équilibre particulièrement net entre dépenses et gains."
      dangerOracle:
        name: Oracle des dangers
        description: >-
          Equivalent efficace aux personnes >= 2,5, ou l'échelle de danger est déjà entrée dans la catégorie risque
          élevé. Vous êtes confronté à la pression réelle d'un collègue multiplié.
      budgetCoordinator:
        name: Coordinateur budgétaire
        description: >-
          Le budget actuel peut supporter >= 8 flux de travail équivalents. Cette configuration est non seulement
          viable, mais elle est également facile à mettre à l’échelle.
    overlay:
      eyebrow: TITRE ACQUIS
      title: Nouveau titre débloqué
      description: >-
        Il n'y a plus de panneau de titre toujours actif. Lorsqu'un titre est gagné pour la première fois, il est
        affiché en plein écran, puis la page revient à la normale.
      footer: >-
        La révélation n'a lieu que lors de la première acquisition. Atteindre à nouveau la même condition ne la rejouera
        pas.
      action: Retour à la page
    toast:
      title: Nouveau titre gagné
      description: "Débloqué\_: {{titles}}"

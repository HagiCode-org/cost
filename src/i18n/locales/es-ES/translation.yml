  hagicode:
    heading: ¿Qué pasaría si Hagicode amplificara su eficiencia?
    subtitle: >-
      Hagicode puede impulsar múltiples agentes en paralelo, convirtiendo la propuesta, implementación, correcciones y
      revisión de esperas en serie en progreso paralelo. Ajuste el control deslizante a continuación e inmediatamente
      volveremos a calcular la amenaza de los compañeros de trabajo y el valor AI según este modelo revisado.
    multiplierLabel: Sesiones paralelas
    sliderLabel: Sesiones paralelas
    sliderHint: >-
      Deslice entre 1,5 y 10 para establecer cuántas sesiones paralelas gestiona Hagicode simultáneamente. Más sesiones
      paralelas significan una mayor amplificación de la eficiencia subjetiva.
    utilizationLabel: Token aumento de utilización
    utilizationHint: >-
      Desliza entre 1.1 y 2.0. Una mayor utilización significa que OpenSpec reduce el retrabajo, el mal uso y las
      alucinaciones, por lo que el gasto real en tokens se diluye bajo el mismo resultado objetivo.

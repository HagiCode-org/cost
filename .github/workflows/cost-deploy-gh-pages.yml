name: Cost Deploy gh-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cost-deploy-gh-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  NODE_ENV: production
  COST_GH_PAGES_PAYLOAD_DIR: .deploy/gh-pages
  COST_SITE_BASE_PATH: ${{ vars.COST_SITE_BASE_PATH || '/' }}
  COST_SITE_URL: ${{ vars.COST_SITE_URL || 'https://cost.hagicode.com/' }}

jobs:
  build:
    name: Build validated site snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify site
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ env.COST_SITE_BASE_PATH }}
          VITE_SITE_URL: ${{ env.COST_SITE_URL }}

      - name: Assemble gh-pages publication payload
        run: |
          rm -rf "${COST_GH_PAGES_PAYLOAD_DIR}"
          mkdir -p "${COST_GH_PAGES_PAYLOAD_DIR}/dist"
          cp .github/gh-pages/esa.jsonc "${COST_GH_PAGES_PAYLOAD_DIR}/esa.jsonc"
          cp -R dist/. "${COST_GH_PAGES_PAYLOAD_DIR}/dist/"

      - name: Upload validated gh-pages payload
        uses: actions/upload-artifact@v4
        with:
          name: cost-gh-pages-payload
          path: ${{ env.COST_GH_PAGES_PAYLOAD_DIR }}
          if-no-files-found: error

  deploy:
    name: Publish validated snapshot to gh-pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    environment:
      name: cost-production
      url: https://cost.hagicode.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated gh-pages payload
        uses: actions/download-artifact@v4
        with:
          name: cost-gh-pages-payload
          path: .deploy/gh-pages

      - name: Publish validated gh-pages payload
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./.deploy/gh-pages
          force_orphan: true
          enable_jekyll: false

      - name: Summarize deployment output
        run: |
          echo "Published the validated gh-pages payload with ./esa.jsonc and ./dist/." >> "$GITHUB_STEP_SUMMARY"
          echo "Cost production is now sourced from the gh-pages branch artifact, not from manual branch edits." >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub environment: cost-production" >> "$GITHUB_STEP_SUMMARY"
          echo "Configured base path: $COST_SITE_BASE_PATH" >> "$GITHUB_STEP_SUMMARY"
          echo "Expected public URL: $COST_SITE_URL" >> "$GITHUB_STEP_SUMMARY"

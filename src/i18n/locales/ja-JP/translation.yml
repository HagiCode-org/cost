        name: コストテイマー
        description: AI 投入対効果 >= 2.5 で、AI コスト比率は <= 15%。コストとリターンのバランスがかなりきれいです。
      dangerOracle:
        name: デンジャー・オラクル
        description: 等価人員が >= 2.5、または危険度が高リスク帯に入っています。「拡張された同僚」の圧力を、かなり現実的に感じ始めている状態です。
      budgetCoordinator:
        name: 予算コーディネーター
        description: 現在の予算で、同等のワークフローを 8 本以上まかなえます。このやり方は回るだけでなく、横展開もしやすいです。

    other: Другой
  titles:
    eyebrow: ОСОБЫЕ ЗВАНИЯ
    title: Панель особых званий
    subtitle: >-
      Правила на стороне ввода и на стороне результата оцениваются вместе, поэтому страница может сказать вам, на какой
      тип оператора Agent похожа эта настройка.
    zeroTokenHint: >-
      Вы потратили ноль жетонов, поэтому обычная оценка для этого запуска пропускается, но мы все равно можем судить,
      какие титулы разблокируются вашей текущей установкой.
    progress: Выполнено {{matched}} из {{total}} званий
    states:
      newly-earned: Новое
      earned: Получено
      locked: Не открыто
    origins:
      input: Триггер на стороне входа
      output: Триггер на стороне результата
    explainers:
      input: 'Условие со стороны ввода: достаточно текущих значений формы.'
      output: 'Условие со стороны результата: обычный расчет должен пройти нужные пороги.'
    catalog:
      craftsmanSpirit:
        name: Дух мастера
        description: >-
          Ежедневные жетоны = 0, тогда как зарплата, город, модель и множитель действительны. Вы совершенствуете рабочий
          процесс, прежде чем принять решение потратить токены.
      promptAlchemist:
        name: Prompt Алхимик
        description: >-
          Множитель производительности >= 6 и 0 < ежедневные токены <= 20. Вы выжимаете серьезную выгоду из все еще
          дисциплинированного бюджета токенов.
      allInOperator:
        name: Полный форсаж
        description: >-
          Ежедневные токены >= 150 и множитель производительности >= 3. Это признак высокоинтенсивного и дорогостоящего
          рабочего процесса Agent.
      minimalistRunner:
        name: Минималистский раннер
        description: >-
          0 < ежедневные токены <= 5 и множитель производительности >= 2. Вы сохраняете полезность рабочего процесса
          даже при почти небольшом бюджете токенов.
      costTamer:
        name: Укротитель стоимости
        description: >-
          Экономическая эффективность >= 2,5, а доля затрат AI остается <= 15%. Вы обнаружили особенно чистый баланс
          между расходами и отдачей.
      dangerOracle:
        name: Опасный Оракул
        description: >-
          Эквивалентная численность >= 2,5, либо шкала опасности уже вошла в высокий риск. Вы уже ощущаете реальное
          давление «усиленного коллеги».
      budgetCoordinator:
        name: Координатор бюджета
        description: >-
          Текущий бюджет может поддерживать >= 8 эквивалентных рабочих процессов. Эта установка не только жизнеспособна,
          но и легко масштабируется.
    overlay:
      eyebrow: ЗВАНИЕ ПРИОБРЕТЕНО
      title: Новый титул разблокирован
      description: >-
        Больше нет постоянно включенной панели заголовка. Когда заголовок зарабатывается впервые, он открывается один
        раз в полноэкранном режиме, а затем страница возвращается в нормальное состояние.
      footer: >-
        Раскрытие происходит только при первом приобретении. Повторное достижение того же состояния не приведет к
        повторному воспроизведению.
      action: Вернуться на страницу
    toast:
      title: Получен новый титул
      description: 'Разблокировано: {{titles}}'

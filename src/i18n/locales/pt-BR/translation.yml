  titles:
    eyebrow: TÍTULOS ESPECIAIS
    title: Placa de título especial
    subtitle: >-
      As regras do lado da entrada e do lado do resultado são avaliadas juntas para que a página possa informar a que
      tipo de operador Agent esta configuração se assemelha.
    zeroTokenHint: >-
      Você não gastou nenhum token, então a estimativa normal foi ignorada nesta execução, mas ainda podemos avaliar
      quais títulos sua configuração atual desbloqueia.
    progress: '{{matched}} / {{total}} títulos correspondentes'
    states:
      newly-earned: Recém-ganho
      earned: Merecido
      locked: Bloqueado
    origins:
      input: Gatilho do lado da entrada
      output: Gatilho do lado do resultado
    explainers:
      input: 'De uma regra do lado da entrada: apenas os valores atuais do formulário são suficientes para desbloqueá-lo.'
      output: 'De uma regra do lado dos resultados: a estimativa normal deve ultrapassar os limites exigidos.'
    catalog:
      craftsmanSpirit:
        name: Espírito de artesão
        description: >-
          Tokens diários = 0 enquanto salário, cidade, modelo e multiplicador são todos válidos. Você está refinando o
          fluxo de trabalho antes de decidir gastar tokens.
      promptAlchemist:
        name: Prompt Alquimista
        description: >-
          Multiplicador de desempenho >= 6 e 0 <tokens diários <= 20. Você está extraindo uma grande vantagem de um
          orçamento de tokens ainda disciplinado.
      allInOperator:
        name: Operador All-In
        description: >-
          Tokens diários >= 150 e multiplicador de desempenho >= 3. Esta é a assinatura de um fluxo de trabalho Agent de
          alta intensidade e alto gasto.
      minimalistRunner:
        name: Corredor Minimalista
        description: >-
          0 <tokens diários <= 5 e multiplicador de desempenho >= 2. Você mantém o fluxo de trabalho útil mesmo com um
          orçamento de tokens quase pequeno.
      costTamer:
        name: Domador de custos
        description: >-
          Eficácia de custos >= 2,5 enquanto AI divisão de custos permanece <= 15%. Você encontrou um equilíbrio
          notavelmente claro entre gastos e retorno.
      dangerOracle:
        name: Perigo Oráculo
        description: >-
          Pessoas efetivas equivalentes >= 2,5, ou a escala de perigo já entrou em alto risco. Você está diante da
          pressão real de um colega de trabalho multiplicado.
      budgetCoordinator:
        name: Coordenador de Orçamento
        description: >-
          O orçamento atual pode sustentar >= 8 fluxos de trabalho equivalentes. Essa configuração não é apenas viável,
          mas também fácil de escalar.
    overlay:
      eyebrow: TÍTULO ADQUIRIDO
      title: Novo título desbloqueado
      description: >-
        Não há mais painel de título sempre ativo. Quando um título é obtido pela primeira vez, ele é revelado em tela
        inteira e a página volta ao normal.
      footer: A revelação só acontece na primeira aquisição. Alcançar a mesma condição novamente não irá reproduzi-la.
      action: Voltar para a página
    toast:
      title: Novo título conquistado
      description: 'Desbloqueado: {{titles}}'

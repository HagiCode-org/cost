    efficiencyValue: 300%
    comparison:
      traditional: Flux série traditionnel
      hagicode: Hagicode + OpenSpec
    workflowTitle: Flux de travail OpenSpec en neuf étapes
    workflowHint: La séquence correspond au panneau de la page d'accueil source d'Idea à Archive.
    workflow:
      idea:
        label: Idée
        description: Commencez avec un objectif et une portée clairs
      proposal:
        label: Proposition
        description: Laissez AI rédiger la proposition et les grandes lignes de l'impact.
      review:
        label: Revoir
        description: Examinez le plan avant le début de la mise en œuvre
      tasks:
        label: Tâches
        description: Divisez le travail en étapes exécutables
      code:
        label: Code
        description: Implémenter avec un contexte de projet stable
      test:
        label: Test
        description: Vérifier le comportement et la couverture de régression
      refactor:
        label: Refactoriser
        description: Polir la structure après validation
      docs:
        label: Documents
        description: Publier des documents et des connaissances réutilisables
      archive:
        label: Archive
        description: Archiver le résultat pour une réutilisation future
  efficient:
    badge: EFFICACE
    title: Efficace
    subtitle: Exécution multi-agents et multi-instances qui maintient votre quota occupé
    description: >-
      Claude Code, Codex et d'autres agents CLI peuvent piloter plusieurs instances en même temps, de sorte que les
      propositions, correctifs, révisions et tâches de support se déplacent en parallèle au lieu d'attendre dans une
      seule file d'attente.
    comparison:
      traditional: Agent unique traditionnel / instance unique
      multiAgent: Matrice parallèle multi-agents
    throughputLabel: Augmentation du débit
    throughputValue: 10x+ parallèle
    providersTitle: CLI actuellement prises en charge

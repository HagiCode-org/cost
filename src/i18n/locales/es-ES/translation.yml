    scaledAnnualAiCost: Costo anual escalado AI
    syncResult: Impacto de titulares sincronizado
    syncFormula: Amenaza de compañero de trabajo {{threatBefore}} -> {{threatAfter}}, AI valor {{valueBefore}} -> {{valueAfter}}
    modelLabel: Modelo de token revisado
    modelFormula: >-
      Nuevo gasto de token = base {{base}} x Hagicode {{boost}} ÷ utilización de token {{utilization}} = {{final}}. En
      otras palabras, primero se expande a {{raw}}, luego la eficiencia del flujo de trabajo estandarizado reduce el
      gasto efectivo a {{final}}.

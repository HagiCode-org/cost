  titles:
    eyebrow: SPEZIELLE TITEL
    title: Spezielle Titeltafel
    subtitle: >-
      Eingabe- und ergebnisseitige Regeln werden gemeinsam ausgewertet, sodass Sie auf der Seite erkennen können,
      welcher Art von Agent-Operator diese Konfiguration ähnelt.
    zeroTokenHint: >-
      Sie haben null Token ausgegeben, daher wird die normale Schätzung für diesen Lauf übersprungen, aber wir können
      trotzdem beurteilen, welche Titel Ihr aktuelles Setup freischaltet.
    progress: '{{matched}} / {{total}} Titel stimmten überein'
    states:
      newly-earned: Neu verdient
      earned: Verdient
      locked: Gesperrt
    origins:
      input: Eingangsseitiger Trigger
      output: Ergebnisseitiger Trigger
    explainers:
      input: 'Aus einer eingabeseitigen Regel: Die aktuellen Formularwerte allein reichen aus, um es zu entsperren.'
      output: 'Aus einer ergebnisseitigen Regel: Die normale Schätzung muss die erforderlichen Schwellenwerte überschreiten.'
    catalog:
      craftsmanSpirit:
        name: Handwerkergeist
        description: >-
          Tägliche Token = 0, während Gehalt, Stadt, Modell und Multiplikator alle gültig sind. Sie verfeinern den
          Arbeitsablauf, bevor Sie sich entscheiden, Token auszugeben.
      promptAlchemist:
        name: Prompt Alchemist
        description: >-
          Leistungsmultiplikator >= 6 und 0 < tägliche Token <= 20. Sie quetschen einen erheblichen Hebel aus einem
          immer noch disziplinierten Token-Budget heraus.
      allInOperator:
        name: All-In-Betreiber
        description: >-
          Tägliche Token >= 150 und Leistungsmultiplikator >= 3. Dies ist die Signatur eines hochintensiven
          Agent-Workflows mit hohen Ausgaben.
      minimalistRunner:
        name: Minimalistischer Läufer
        description: >-
          0 < tägliche Token <= 5 und Leistungsmultiplikator >= 2. Sie halten den Workflow auch bei einem fast winzigen
          Token-Budget nützlich.
      costTamer:
        name: Kostenzähmer
        description: >-
          Kosteneffizienz >= 2,5, während der AI-Kostenanteil bei <= 15 % bleibt. Sie haben ein besonders sauberes
          Gleichgewicht zwischen Ausgaben und Gewinnen gefunden.
      dangerOracle:
        name: Gefahrenorakel
        description: >-
          Effektives Personenäquivalent >= 2,5 oder die Gefahrenskala hat bereits das hohe Risiko erreicht. Sie sehen
          den wahren Druck eines vervielfachten Kollegen.
      budgetCoordinator:
        name: Haushaltskoordinator
        description: >-
          Das aktuelle Budget kann >= 8 gleichwertige Arbeitsabläufe unterstützen. Dieses Setup ist nicht nur
          realisierbar, sondern auch einfach zu skalieren.
    overlay:
      eyebrow: TITEL ERWORBEN
      title: Neuer Titel freigeschaltet
      description: >-
        Es gibt kein ständig aktives Titelfeld mehr. Wenn ein Titel zum ersten Mal verdient wird, wird er einmal im
        Vollbildmodus angezeigt und dann wird die Seite wieder normal angezeigt.
      footer: >-
        Die Enthüllung erfolgt nur beim ersten Erwerb. Wenn derselbe Zustand erneut erreicht wird, wird er nicht erneut
        abgespielt.
      action: Zurück zur Seite
    toast:
      title: Neuer Titel verdient
      description: 'Entsperrt: {{titles}}'

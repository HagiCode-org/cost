name: Deploy Cost Azure Static Website

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to redeploy (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cost-azure-static-website-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repos/cost
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER || '$web' }}
      CDN_RESOURCE_GROUP: ${{ vars.AZURE_CDN_RESOURCE_GROUP }}
      CDN_PROFILE: ${{ vars.AZURE_CDN_PROFILE }}
      CDN_ENDPOINT: ${{ vars.AZURE_CDN_ENDPOINT }}
      CDN_CONTENT_PATHS: ${{ vars.AZURE_CDN_CONTENT_PATHS || '/*' }}
      RELEASE_ASSET_DIR: ${{ runner.temp }}/cost-release-download
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: repos/cost/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$RELEASE_TAG" ] || missing+=("release tag")
          [ -n "$STORAGE_ACCOUNT" ] || missing+=("AZURE_STORAGE_ACCOUNT")
          [ -n "$AZURE_CLIENT_ID" ] || missing+=("AZURE_CLIENT_ID")
          [ -n "$AZURE_TENANT_ID" ] || missing+=("AZURE_TENANT_ID")
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || missing+=("AZURE_SUBSCRIPTION_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing deployment configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Download frozen release assets
        id: download_frozen_release_assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf "$RELEASE_ASSET_DIR"
          mkdir -p "$RELEASE_ASSET_DIR"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RELEASE_ASSET_DIR" \
            --pattern "cost-site-*.tar.gz" \
            --pattern "release-manifest.json"
          archive_path=$(find "$RELEASE_ASSET_DIR" -maxdepth 1 -type f -name 'cost-site-*.tar.gz' | head -n 1)
          manifest_path="$RELEASE_ASSET_DIR/release-manifest.json"
          [ -n "$archive_path" ] || { echo "Frozen site archive not found for $RELEASE_TAG" >&2; exit 1; }
          [ -f "$manifest_path" ] || { echo "release-manifest.json not found for $RELEASE_TAG" >&2; exit 1; }
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "manifest_path=$manifest_path" >> "$GITHUB_OUTPUT"

      - name: Validate frozen release metadata
        run: |
          node ./scripts/deploy/upload-static-website.mjs validate \
            --archive "${{ steps.download_frozen_release_assets.outputs.archive_path }}" \
            --manifest "${{ steps.download_frozen_release_assets.outputs.manifest_path }}" \
            --expectedTag "$RELEASE_TAG" \
            --storageAccount "$STORAGE_ACCOUNT" \
            --container "$STORAGE_CONTAINER"
        id: validate_frozen_release_metadata

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy frozen release to Azure Static Website
        run: |
          node ./scripts/deploy/upload-static-website.mjs deploy \
            --archive "${{ steps.download_frozen_release_assets.outputs.archive_path }}" \
            --manifest "${{ steps.download_frozen_release_assets.outputs.manifest_path }}" \
            --expectedTag "$RELEASE_TAG" \
            --storageAccount "$STORAGE_ACCOUNT" \
            --container "$STORAGE_CONTAINER" \
            --cdnResourceGroup "$CDN_RESOURCE_GROUP" \
            --cdnProfile "$CDN_PROFILE" \
            --cdnEndpoint "$CDN_ENDPOINT" \
            --cdnContentPaths "$CDN_CONTENT_PATHS"

      - name: Summarize deployment
        run: |
          {
            echo "## Cost Azure Static Website deployment"
            echo ""
            echo "- Release tag: $RELEASE_TAG"
            echo "- Storage account: $STORAGE_ACCOUNT"
            echo "- Container: $STORAGE_CONTAINER"
            if [ -n "$CDN_RESOURCE_GROUP" ] && [ -n "$CDN_PROFILE" ] && [ -n "$CDN_ENDPOINT" ]; then
              echo "- CDN purge: executed for $CDN_PROFILE/$CDN_ENDPOINT"
            else
              echo "- CDN purge: skipped (configuration not provided)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

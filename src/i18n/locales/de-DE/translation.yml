  hagicode:
    heading: Was wäre, wenn Hagicode Ihre Effizienz steigern würde?
    subtitle: >-
      Hagicode kann mehrere Agenten parallel steuern und Vorschläge, Implementierungen, Korrekturen und Überprüfungen
      von seriellen Wartezeiten in parallele Fortschritte umwandeln. Passen Sie den Schieberegler unten an und wir
      berechnen die Bedrohung durch Kollegen und den AI-Wert unter diesem überarbeiteten Modell sofort neu.
    multiplierLabel: Parallele Sitzungen
    sliderLabel: Parallele Sitzungen
    sliderHint: >-
      Schieben Sie zwischen 1,5 und 10, um festzulegen, wie viele parallele Sitzungen Hagicode gleichzeitig verwaltet.
      Mehr parallele Sitzungen bedeuten eine stärkere subjektive Effizienzsteigerung.
    utilizationLabel: Token Nutzungssteigerung
    utilizationHint: >-
      Schieben Sie zwischen 1,1 und 2,0. Eine höhere Auslastung bedeutet, dass OpenSpec Nacharbeit, Missbrauch und
      Halluzinationen reduziert, sodass die tatsächlichen Token-Ausgaben bei gleicher Zielausgabe verwässert werden.

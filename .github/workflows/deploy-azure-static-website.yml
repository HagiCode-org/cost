name: Deploy Cost Site

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to redeploy (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cost-release-deploy-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Cost Site
    permissions:
      contents: read
    defaults:
      run:
        working-directory: repos/cost
    env:
      NODE_VERSION: "20"
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      COST_SITE_BASE_PATH: ${{ vars.COST_SITE_BASE_PATH || '/' }}
      COST_SITE_URL: ${{ vars.COST_SITE_URL || 'https://cost.hagicode.com/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: repos/cost/package-lock.json

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?([+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Align package version for release build
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: NODE_ENV=production npm run build
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
          VITE_BASE_PATH: ${{ env.COST_SITE_BASE_PATH }}
          VITE_SITE_URL: ${{ env.COST_SITE_URL }}

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_COST }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "repos/cost/dist"
          api_location: ""
          skip_app_build: true

      - name: Summarize deployment
        shell: bash
        run: |
          {
            echo "## Cost deployment finished"
            echo
            echo "- Release tag: $RELEASE_TAG"
            echo "- Build source: repository checkout at $RELEASE_TAG"
            echo "- Base path: $COST_SITE_BASE_PATH"
            echo "- Site URL: $COST_SITE_URL"
            echo "- Deploy action: Azure/static-web-apps-deploy@v1"
          } >> "$GITHUB_STEP_SUMMARY"
